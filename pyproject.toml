[project]
name = "sales-agents"
version = "0.1.0"
description = "Multi-agent sales system: lead research, qualification, outreach drafting and CRM follow-up, evaluated on synthetic data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents==0.7.37",
    "langchain[openai]",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sales_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not llm'"
markers = [
    "llm: calls a real model, run only through the token guard",
]

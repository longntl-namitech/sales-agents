<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sales-agents demo</title>
<style>
  :root {
    --bg:#f4f5f8; --panel:#ffffff; --ink:#161b26; --muted:#6a7385; --line:#e4e7ee; --soft:#f0f2f7;
    --accent:#4361ee; --accent-ink:#fff;
    --ok:#12805c; --ok-bg:#e6f6ee; --bad:#c0392b; --bad-bg:#fdecea; --warn:#a15c00; --warn-bg:#fff4e0;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 4px 16px rgba(16,24,40,.05);
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#0f1218; --panel:#171c25; --ink:#e8ecf3; --muted:#8f99ad; --line:#272e3b; --soft:#1e2531;
    --accent:#7c93ff; --accent-ink:#0f1218;
    --ok:#4cc99b; --ok-bg:#12302a; --bad:#ff8a7a; --bad-bg:#3a1c1a; --warn:#f2b45a; --warn-bg:#352814;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.25);
  } }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14.5px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; display:flex; flex-direction:column; }
  button, input, textarea { font:inherit; color:inherit; }
  header { display:flex; align-items:center; gap:12px; padding:14px 24px; background:var(--panel); border-bottom:1px solid var(--line); }
  .logo { width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg,var(--accent),#9b5de5); display:grid; place-items:center; color:#fff; font-weight:700; font-size:15px; }
  header h1 { margin:0; font-size:15px; font-weight:650; letter-spacing:-.01em; }
  header p { margin:0; color:var(--muted); font-size:12.5px; }
  .shell { flex:1; min-height:0; display:grid; grid-template-columns:320px minmax(0,1fr); }
  aside { border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  .search { padding:14px; border-bottom:1px solid var(--line); }
  .search input { width:100%; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:var(--soft); outline:none; }
  .search input:focus { border-color:var(--accent); }
  #leads { overflow-y:auto; padding:8px; flex:1; }
  .lead { width:100%; text-align:left; padding:9px 12px; border:1px solid transparent; border-radius:10px; background:none; cursor:pointer; display:block; }
  .lead:hover { background:var(--soft); }
  .lead.sel { background:var(--soft); border-color:var(--accent); }
  .lead .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .lead b { font-weight:600; }
  .lead small { color:var(--muted); display:block; }
  .tag { font-size:11px; padding:0 6px; border-radius:99px; background:var(--soft); border:1px solid var(--line); color:var(--muted); }
  .lead.sel .tag { background:var(--panel); }
  .runbar { padding:14px; border-top:1px solid var(--line); }
  .btn { padding:8px 16px; border:1px solid var(--line); border-radius:9px; background:var(--panel); cursor:pointer; font-weight:550; }
  .btn:hover:not(:disabled) { background:var(--soft); }
  .btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .btn.primary:hover:not(:disabled) { filter:brightness(1.08); background:var(--accent); }
  .btn.ok { background:var(--ok); color:#fff; border-color:var(--ok); }
  .btn:disabled { opacity:.5; cursor:default; }
  .runbar .btn { width:100%; padding:10px; }
  main { display:flex; flex-direction:column; min-height:0; min-width:0; }
  .stepper { display:flex; gap:6px; padding:14px 24px; border-bottom:1px solid var(--line); background:var(--panel); overflow-x:auto; }
  .stage { display:flex; align-items:center; gap:8px; padding:5px 12px 5px 6px; border-radius:99px; border:1px solid var(--line); color:var(--muted); font-size:12.5px; white-space:nowrap; }
  .stage i { width:20px; height:20px; border-radius:50%; background:var(--soft); display:grid; place-items:center; font-style:normal; font-size:11px; font-weight:700; }
  .stage.active { color:var(--ink); border-color:var(--accent); }
  .stage.active i { background:var(--accent); color:var(--accent-ink); animation:pulse 1.2s infinite; }
  .stage.done { color:var(--ink); }
  .stage.done i { background:var(--ok); color:#fff; }
  .stage.wait { color:var(--warn); border-color:var(--warn); background:var(--warn-bg); }
  .stage.wait i { background:var(--warn); color:#fff; }
  @keyframes pulse { 50% { box-shadow:0 0 0 5px color-mix(in srgb, var(--accent) 25%, transparent); } }
  #chat { flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:14px; }
  .row { display:flex; gap:12px; max-width:760px; }
  .row.me { align-self:flex-end; }
  .avatar { flex:none; width:32px; height:32px; border-radius:10px; display:grid; place-items:center; color:#fff; font-size:12px; font-weight:700; }
  .a-researcher { background:#3a86ff; } .a-qualifier { background:#8338ec; } .a-writer { background:#fb5607; }
  .a-crm_agent { background:#2a9d8f; } .a-you { background:var(--ink); color:var(--bg); } .a-system { background:var(--muted); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 14px; box-shadow:var(--shadow); min-width:0; overflow-wrap:anywhere; }
  .me .card { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .who { font-size:12px; font-weight:650; color:var(--muted); margin-bottom:2px; }
  .badge { display:inline-block; padding:1px 9px; border-radius:99px; font-size:12px; font-weight:650; }
  .b-hot { background:var(--bad-bg); color:var(--bad); } .b-warm { background:var(--warn-bg); color:var(--warn); } .b-cold { background:var(--soft); color:var(--muted); }
  .b-ok { background:var(--ok-bg); color:var(--ok); } .b-bad { background:var(--bad-bg); color:var(--bad); }
  .dots::after { content:""; animation:dots 1.2s steps(4) infinite; }
  @keyframes dots { 0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."} }
  .note { color:var(--muted); font-size:13px; margin-top:4px; }
  .email { margin:10px 0; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--panel); }
  .email .subj { padding:9px 14px; background:var(--soft); border-bottom:1px solid var(--line); font-weight:650; }
  .email .subj span { color:var(--muted); font-weight:500; margin-right:6px; }
  .email .body { padding:12px 14px; white-space:pre-wrap; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  textarea { width:100%; min-height:200px; padding:12px 14px; border:1px solid var(--accent); border-radius:10px; background:var(--panel); resize:vertical; margin-top:8px; outline:none; }
  pre { margin:8px 0 0; padding:10px 12px; background:var(--soft); border:1px solid var(--line); border-radius:8px; font:12px/1.5 ui-monospace, "SF Mono", monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
  .empty { margin:auto; text-align:center; color:var(--muted); max-width:380px; }
  .empty h2 { color:var(--ink); font-size:18px; margin:0 0 6px; }
  dialog { border:1px solid var(--line); border-radius:14px; background:var(--panel); color:var(--ink); box-shadow:var(--shadow); padding:20px; width:min(420px, 92vw); }
  dialog::backdrop { background:rgba(10,14,22,.45); }
  dialog input { width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:var(--soft); margin:10px 0 14px; outline:none; }
  @media (max-width:820px) {
    .shell { grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr); }
    aside { border-right:0; border-bottom:1px solid var(--line); max-height:42vh; }
    header, #chat, .stepper { padding-left:16px; padding-right:16px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">S</div>
  <div><h1>sales-agents</h1><p>Supervisor with Researcher, Qualifier, Writer and CRM subagents. Nothing is ever sent.</p></div>
</header>
<div class="shell">
  <aside>
    <div class="search"><input id="filter" type="search" placeholder="Search leads" aria-label="Search leads"></div>
    <div id="leads" role="listbox" aria-label="Leads"></div>
    <div class="runbar"><button id="run" class="btn primary" disabled>Run lead</button></div>
  </aside>
  <main>
    <div class="stepper" id="stepper"></div>
    <div id="chat" aria-live="polite"></div>
  </main>
</div>
<dialog id="reject"><b>Reject this draft</b><input id="why" placeholder="Reason (optional)"><div class="actions"><button class="btn primary" id="rejectGo">Reject</button><button class="btn" id="rejectCancel">Cancel</button></div></dialog>
<script>
const $ = id => document.getElementById(id);
const chat = $('chat'), runBtn = $('run'), stepper = $('stepper');
const AGENTS = {
  researcher: ['Researcher', 'R', 'Looking up company facts and buying signals'],
  qualifier: ['Qualifier', 'Q', 'Scoring the lead against the rubric'],
  writer: ['Writer', 'W', 'Drafting the outreach email from product docs'],
  crm_agent: ['CRM agent', 'C', 'Working with the mock CRM'],
};
const STAGES = [['researcher', 'Research'], ['qualifier', 'Qualify'], ['writer', 'Draft'], ['approval', 'Your approval'], ['crm', 'CRM']];
let runId = null, leads = [], selected = null, busy = false, working = null;

function renderStepper(state = {}) {
  stepper.replaceChildren(...STAGES.map(([key, label], i) => {
    const el = document.createElement('div');
    el.className = 'stage ' + (state[key] || '');
    el.innerHTML = '<i></i><span></span>';
    el.querySelector('i').textContent = state[key] === 'done' ? '✓' : i + 1;
    el.querySelector('span').textContent = label;
    return el;
  }));
}
const stageState = {};
function stage(key, value) { stageState[key] = value; renderStepper(stageState); }

function scroll() { requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; }); }
function row(kind, who, node, extra = '') {
  const r = document.createElement('div'); r.className = 'row' + (kind === 'you' ? ' me' : '');
  const a = document.createElement('div'); a.className = 'avatar a-' + kind; a.textContent = who;
  const c = document.createElement('div'); c.className = 'card ' + extra;
  if (typeof node === 'string') c.textContent = node; else c.append(...[].concat(node));
  r.append(...(kind === 'you' ? [c, a] : [a, c]));
  chat.append(r); scroll();
  return c;
}
function who(name) { const d = document.createElement('div'); d.className = 'who'; d.textContent = name; return d; }
function badge(text, cls) { const s = document.createElement('span'); s.className = 'badge ' + cls; s.textContent = text; return s; }
function text(t, cls) { const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = t; return d; }

const DONE = { researcher: 'Company facts gathered', qualifier: 'Lead scored against the rubric', writer: 'Outreach email drafted', crm_agent: 'CRM step finished' };
function finishWorking() { if (working) { const body = working.querySelector('.what'); if (body) body.textContent = DONE[working.dataset.agent] || 'Done'; working = null; } }

async function consume(response) {
  if (!response.ok) { finishWorking(); row('system', '!', [who('Error'), text((await response.json()).detail || response.statusText)], 'err'); setBusy(false); return; }
  const reader = response.body.getReader(), decoder = new TextDecoder();
  let buffer = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let cut;
    while ((cut = buffer.indexOf('\n\n')) >= 0) {
      const line = buffer.slice(0, cut); buffer = buffer.slice(cut + 2);
      if (line.startsWith('data: ')) handle(JSON.parse(line.slice(6)));
    }
  }
}

function handle(e) {
  if (e.type === 'started') { runId = e.run_id; }
  else if (e.type === 'step') step(e.agent);
  else if (e.type === 'tool') tool(e);
  else if (e.type === 'approval') approval(e.draft_text);
  else if (e.type === 'result') result(e.record);
}

function step(agent) {
  finishWorking();
  const [name, letter, what] = AGENTS[agent] || [agent, '?', 'Working'];
  if (agent === 'researcher') stage('researcher', 'active');
  if (agent === 'qualifier') { stage('researcher', 'done'); stage('qualifier', 'active'); }
  if (agent === 'writer') { stage('qualifier', 'done'); stage('writer', 'active'); }
    const body = text(what, 'what');
  const dots = document.createElement('span'); dots.className = 'dots'; body.append(dots);
  working = row(agent, letter, [who(name), body]);
  working.dataset.agent = agent;
}

function tool(e) {
  finishWorking();
  if (e.name === 'upsert_lead') {
    let data = {};
    try { data = JSON.parse(e.text); } catch {}
    const kids = [who('CRM agent')];
    const line = text('Saved the lead to the CRM as '); line.append(badge((data.label || '?').toUpperCase(), 'b-' + (data.label || 'cold')));
    kids.push(line);
    if (data.notes) kids.push(text(data.notes, 'note'));
    row('crm_agent', 'C', kids);
  } else if (e.name === 'record_outreach') {
    const blocked = /^BLOCKED/i.test(e.text);
    const kids = [who('Guardrail and CRM')];
    const line = text(''); line.append(badge(blocked ? 'Blocked' : 'Recorded', blocked ? 'b-bad' : 'b-ok'));
    kids.push(line, text(blocked ? e.text : 'The draft passed the guardrail checks and is recorded in the mock CRM.', 'note'));
    row('crm_agent', 'C', kids);
  }
}

function emailCard(draft) {
  const [first, ...rest] = draft.split('\n');
  const hasSubject = rest.length && rest[0] === '';
  const wrap = document.createElement('div'); wrap.className = 'email';
  const subj = document.createElement('div'); subj.className = 'subj';
  const s = document.createElement('span'); s.textContent = 'Subject'; subj.append(s, document.createTextNode(hasSubject ? first : '(none)'));
  const body = document.createElement('div'); body.className = 'body'; body.textContent = hasSubject ? rest.slice(1).join('\n') : draft;
  wrap.append(subj, body);
  return wrap;
}

function approval(draft) {
  finishWorking();
  stage('qualifier', 'done'); stage('writer', 'done'); stage('approval', 'wait');
  const actions = document.createElement('div'); actions.className = 'actions';
  const card = row('writer', 'W', [who('Writer'), text('Draft ready. Nothing is recorded until you decide.'), emailCard(draft), actions]);
  const send = async body => {
    card.querySelectorAll('button, textarea').forEach(b => b.disabled = true);
    stage('approval', 'done'); stage('crm', 'active');
    await consume(await fetch(`/api/runs/${runId}/decision`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }));
    setBusy(false);
  };
  const mk = (label, cls, fn) => { const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = label; b.onclick = fn; actions.append(b); return b; };
  mk('Approve', 'ok', () => { row('you', 'You', 'Approve', ''); send({ type: 'approve' }); });
  mk('Edit', '', () => {
    const box = document.createElement('textarea'); box.value = draft;
    const go = document.createElement('button'); go.className = 'btn primary'; go.style.marginTop = '8px'; go.textContent = 'Approve with edits';
    go.onclick = () => { row('you', 'You', 'Approve with edits'); send({ type: 'edit', text: box.value }); };
    card.append(box, go); box.focus(); scroll();
  });
  mk('Reject', '', () => $('reject').showModal());
  $('rejectGo').onclick = () => { const why = $('why').value.trim() || 'rejected by the reviewer'; $('reject').close(); $('why').value = ''; row('you', 'You', 'Reject: ' + why); send({ type: 'reject', message: why }); };
  $('rejectCancel').onclick = () => $('reject').close();
}

function result(record) {
  finishWorking();
  stage('crm', 'done');
  const kids = [who('Result')];
  const line = text('');
  if (record) {
    line.append('Label ', badge(record.label.toUpperCase(), 'b-' + record.label), ' ', badge(record.outreach ? 'Draft recorded' : 'No draft recorded', record.outreach ? 'b-ok' : 'b-cold'));
    kids.push(line);
    const pre = document.createElement('pre'); pre.textContent = JSON.stringify({ ...record, outreach: record.outreach ? '(the approved draft above)' : null }, null, 2); kids.push(pre);
  } else kids.push(text('No CRM record.'));
  row('system', '✓', kids);
  setBusy(false);
}

function setBusy(v) { busy = v; runBtn.disabled = v || !selected; runBtn.textContent = v ? 'Running...' : 'Run lead'; }

function renderLeads() {
  const q = $('filter').value.trim().toLowerCase();
  $('leads').replaceChildren(...leads.filter(l => (l.lead_id + ' ' + l.company_name + ' ' + l.contact_role).toLowerCase().includes(q)).map(l => {
    const b = document.createElement('button'); b.className = 'lead' + (l.lead_id === selected ? ' sel' : ''); b.setAttribute('role', 'option');
    const n = document.createElement('b'); n.textContent = l.company_name;
    const t = document.createElement('span'); t.className = 'tag'; t.textContent = l.source;
    const top = document.createElement('div'); top.className = 'top'; top.append(n, t);
    const s = document.createElement('small'); s.textContent = l.lead_id + ' \u00b7 ' + l.contact_role;
    b.append(top, s);
    b.onclick = () => { selected = l.lead_id; setBusy(busy); renderLeads(); };
    return b;
  }));
}

function intro() {
  const d = document.createElement('div'); d.className = 'empty';
  d.innerHTML = '<h2>Pick a lead, press Run</h2><div>The Supervisor hands the lead to the Researcher, Qualifier, Writer and CRM agent. A hot lead stops for your decision before anything is recorded.</div>';
  chat.replaceChildren(d);
}

runBtn.onclick = async () => {
  if (!selected || busy) return;
  setBusy(true);
  for (const k in stageState) delete stageState[k];
  renderStepper(); chat.replaceChildren();
  const l = leads.find(x => x.lead_id === selected);
  row('you', 'You', `Run ${l.lead_id} (${l.company_name})`);
  await consume(await fetch('/api/runs', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ lead_id: selected }) }));
};
$('filter').oninput = renderLeads;
renderStepper(); intro();
fetch('/api/leads').then(r => r.json()).then(data => { leads = data; renderLeads(); });
</script>
</body>
</html>
